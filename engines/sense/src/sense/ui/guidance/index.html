<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Sense</title>
    <style>
      /* The Context Site's Seomun reading tokens, without its app runtime. */
      :root {
        color-scheme: light;
        --paper: #f9f9f9;
        --ink: #111;
        --muted: #686868;
        --line: #dedede;
        --soft: #f0f0f0;
        --focus: #245dc1;
        --measure: 48rem;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --paper: #191919;
          --ink: #eee;
          --muted: #b5b5b5;
          --line: #414141;
          --soft: #252525;
          --focus: #9ebfff;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: system-ui, -apple-system, BlinkMacSystemFont,
          "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
        font-size: 17px;
        line-height: 1.75;
        word-break: keep-all;
        overflow-wrap: anywhere;
        -webkit-font-smoothing: antialiased;
      }
      button, summary { font: inherit; color: inherit; }
      a { color: inherit; text-underline-offset: .25em; }
      :focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }
      ::selection { background: var(--ink); color: var(--paper); }
      .shell { max-width: calc(var(--measure) + 5rem); margin: auto; padding: 0 2.5rem 4rem; }
      .document-header { margin: 3.5rem auto 2.5rem; text-align: center; }
      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 5vw, 4rem);
        font-weight: 400;
        line-height: 1.3;
        letter-spacing: -.045em;
      }
      .document-toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        margin-bottom: 3rem;
        padding-bottom: .7rem;
        border-bottom: 1px solid var(--line);
      }
      .source { color: var(--muted); font-size: .8rem; }
      .actions { display: flex; align-items: center; gap: .35rem; }
      .icon-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        padding: .5rem;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
      }
      .icon-button:hover { background: var(--soft); color: var(--ink); }
      .icon-button svg { width: 21px; height: 21px; }
      .group + .group { margin-top: 3.5rem; }
      .group-title { margin: 0 0 1.2rem; font-size: .82rem; font-weight: 500; color: var(--muted); }
      details { border-top: 1px solid var(--line); }
      summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1.5rem;
        min-height: 64px;
        padding: 1.1rem 0;
        cursor: pointer;
        list-style: none;
      }
      summary::-webkit-details-marker { display: none; }
      .section-title { margin: 0; font-size: clamp(1.45rem, 3vw, 2rem); line-height: 1.4; font-weight: 400; letter-spacing: -.035em; }
      .chevron { flex: none; width: 9px; height: 9px; margin: -.25rem .35rem 0 0; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(45deg); }
      details[open] > summary .chevron { transform: rotate(225deg); margin-top: .25rem; }
      .section-body { padding: .6rem 0 2.5rem; }
      .purpose, .skill-description { margin: 0 0 1.4rem; color: var(--muted); font-size: .88rem; }
      .prose > :first-child { margin-top: 0; }
      .prose h4 { margin: 2.2rem 0 1rem; font-size: 1.32rem; font-weight: 500; line-height: 1.5; }
      .prose h5 { margin: 1.8rem 0 1rem; font-size: 1.08rem; font-weight: 500; }
      .prose p { margin: 0 0 1.4rem; white-space: pre-line; }
      .prose ul, .prose ol { padding-left: 1.35rem; margin: 1.3rem 0; }
      .prose li { padding-left: .15rem; margin: .7rem 0; }
      .prose strong { font-weight: 650; }
      .prose pre { overflow: auto; background: var(--soft); border-radius: 6px; padding: 1rem; white-space: pre; font-size: .8rem; }
      .prose code { font-size: .88em; background: var(--soft); padding: .1em .25em; border-radius: 3px; word-break: break-word; }
      .prose pre code { padding: 0; }
      .prose blockquote { border-left: 2px solid var(--line); padding-left: 1.3rem; color: var(--muted); margin: 1.4rem 0; }
      .prose hr { border: 0; border-top: 1px solid var(--line); margin: 2rem 0; }
      .table-wrap { max-width: 100%; overflow-x: auto; margin: 1.5rem 0; }
      .prose table { border-collapse: collapse; font-size: .85rem; text-align: left; width: 100%; }
      .prose td, .prose th { border-bottom: 1px solid var(--line); padding: .7rem .6rem; vertical-align: top; }
      .prose th { font-weight: 500; }
      .skill { margin-top: 2rem; padding-top: 1.4rem; border-top: 1px solid var(--line); }
      .skill-title { margin: 0 0 .6rem; font-size: 1.05rem; font-weight: 500; }
      .skill .prose { font-size: .94rem; }
      .empty, .error { margin: 4rem 0; color: var(--muted); text-align: center; }
      .loading { margin-top: 4rem; }
      .loading span { display: block; max-width: 100%; width: 32rem; height: .8rem; margin: 1.1rem 0; background: var(--soft); }
      .loading span:last-child { width: 22rem; }
      @media (max-width: 640px) {
        body { font-size: 16px; line-height: 1.85; }
        .shell { padding: 0 1.35rem 3rem; }
        .document-header { margin: 2rem auto; }
        h1 { font-size: 2.2rem; }
        .document-toolbar { margin-bottom: 2rem; }
        .section-body { padding-bottom: 2rem; }
      }
      @media (prefers-reduced-motion: no-preference) {
        .icon-button { transition: color .15s, background-color .15s; }
        .chevron { transition: transform .15s; }
      }
    </style>
  </head>
  <body>
    <main class="shell" id="app" aria-busy="true">
      <header class="document-header"><h1>Sense</h1></header>
      <div class="document-toolbar"><span class="source">로컬 자료</span></div>
      <div class="loading" role="status" aria-label="Sense 내용을 불러오는 중">
        <span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>
      </div>
    </main>
    <script type="module">
      const app = document.getElementById("app");
      let rpcId = 0;
      const pending = new Map();
      const iconPaths = {
        expand: ["m7 8 5-5 5 5", "m7 16 5 5 5-5"],
        collapse: ["m7 3 5 5 5-5", "m7 21 5-5 5 5"],
        external: ["M7 17 17 7", "M7 7h10v10"],
      };

      function element(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = String(text);
        return node;
      }

      function icon(name) {
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        for (const [key, value] of Object.entries({ viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", "stroke-width": "1.5", "stroke-linecap": "round", "stroke-linejoin": "round", "aria-hidden": "true", focusable: "false" })) svg.setAttribute(key, value);
        for (const d of iconPaths[name]) {
          const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
          path.setAttribute("d", d); svg.append(path);
        }
        return svg;
      }

      function siteUrl(value) {
        if (typeof value !== "string" || /[\s\u0000-\u0020\u007f\\]/u.test(value)) return null;
        const authority = value.match(/^https?:\/\/([^/?#]+)/i)?.[1];
        if (!authority || authority.includes("@")) return null;
        try {
          const url = new URL(value);
          if (!url.hostname || url.username || url.password) return null;
          if (url.protocol !== "https:" && !(url.protocol === "http:" && /^(localhost|127\.0\.0\.1|\[::1\])(?::\d+)?$/i.test(authority))) return null;
          return url.href;
        } catch { return null; }
      }

      // Both guidance and Skill bodies use the Site reader's small Markdown subset.
      // Text nodes keep raw HTML and unsupported syntax inert.
      function inline(node, text) {
        for (const part of String(text).split(/(\*\*[^*]+\*\*|`[^`]+`|\[[^\]]+\]\([^)]+\))/g)) {
          if (part.startsWith("**") && part.endsWith("**")) node.append(element("strong", "", part.slice(2, -2)));
          else if (part.startsWith("`") && part.endsWith("`")) node.append(element("code", "", part.slice(1, -1)));
          else {
            const link = part.match(/^\[([^\]]+)\]\(([^)]+)\)$/);
            if (link && /^(https?:\/\/|#)/i.test(link[2])) {
              const anchor = element("a", "", link[1]); anchor.href = link[2];
              if (!link[2].startsWith("#")) { anchor.target = "_blank"; anchor.rel = "noopener noreferrer"; }
              node.append(anchor);
            } else node.append(document.createTextNode(part));
          }
        }
        return node;
      }

      function markdown(text, title) {
        const prose = element("div", "prose");
        const lines = String(text ?? "").split("\n");
        for (let i = 0; i < lines.length; i++) {
          const line = lines[i];
          if (!line.trim()) continue;
          const fence = line.match(/^\s*(`{3,}|~{3,})/);
          if (fence) {
            const code = [];
            while (++i < lines.length && !lines[i].trim().startsWith(fence[1])) code.push(lines[i]);
            const pre = element("pre"); pre.append(element("code", "", code.join("\n"))); prose.append(pre); continue;
          }
          const heading = line.match(/^(#{1,6})\s+(.+?)\s*#*\s*$/);
          if (heading) {
            if (i === 0 && heading[1] === "#" && heading[2] === title) continue;
            prose.append(inline(element(heading[1].length <= 2 ? "h4" : "h5"), heading[2])); continue;
          }
          if (/^\s*(?:---+|\*\*\*+)\s*$/.test(line)) { prose.append(element("hr")); continue; }
          const ordered = /^\s*\d+[.)]\s+/.test(line);
          if (ordered || /^\s*[-*]\s+/.test(line)) {
            const list = element(ordered ? "ol" : "ul");
            do { list.append(inline(element("li"), lines[i].replace(/^\s*(?:[-*]|\d+[.)])\s+/, ""))); }
            while (++i < lines.length && (ordered ? /^\s*\d+[.)]\s+/.test(lines[i]) : /^\s*[-*]\s+/.test(lines[i])));
            i--; prose.append(list); continue;
          }
          if (line.includes("|") && /^\s*\|?\s*:?-{3}/.test(lines[i + 1] ?? "")) {
            const cells = value => value.trim().replace(/^\||\|$/g, "").split("|").map(value => value.trim());
            const table = element("table"); const head = element("thead"); const row = element("tr");
            for (const value of cells(line)) row.append(inline(element("th"), value));
            head.append(row); table.append(head); const body = element("tbody"); i += 2;
            while (i < lines.length && lines[i].includes("|") && lines[i].trim()) {
              const row = element("tr"); for (const value of cells(lines[i++])) row.append(inline(element("td"), value)); body.append(row);
            }
            i--; table.append(body); const wrap = element("div", "table-wrap"); wrap.append(table); prose.append(wrap); continue;
          }
          if (/^\s*>/.test(line)) { prose.append(inline(element("blockquote"), line.replace(/^\s*>\s?/, ""))); continue; }
          const paragraph = [line];
          while (i + 1 < lines.length && lines[i + 1].trim() && !/^(#{1,6}\s|\s*[-*>]\s|\s*\d+[.)]\s|\s*[`~]{3}|\s*---+\s*$)/.test(lines[i + 1])) paragraph.push(lines[++i]);
          prose.append(inline(element("p"), paragraph.join("\n")));
        }
        return prose;
      }

      function sectionCard(section) {
        const card = element("details"); card.open = true;
        const summary = element("summary");
        const chevron = element("span", "chevron"); chevron.setAttribute("aria-hidden", "true");
        summary.append(element("h3", "section-title", section?.title ?? "제목 없음"), chevron);
        card.append(summary);
        const body = element("div", "section-body");
        if (section?.purpose) body.append(element("p", "purpose", section.purpose));
        body.append(markdown(section?.text, section?.title));
        if (section?.skill) {
          const skill = element("section", "skill");
          skill.append(element("h4", "skill-title", section.skill.name ?? "이름 없음"));
          if (section.skill.description) skill.append(element("p", "skill-description", section.skill.description));
          skill.append(markdown(section.skill.instructions, section.skill.name)); body.append(skill);
        }
        card.append(body); return card;
      }

      function render(payload) {
        const result = payload?.ok === true ? payload.result : payload;
        const header = element("header", "document-header"); header.append(element("h1", "", "Sense"));
        const toolbar = element("div", "document-toolbar"); toolbar.append(element("span", "source", "로컬 자료"));
        const actions = element("div", "actions"); toolbar.append(actions);
        const content = element("div", "groups"); content.id = "guidance-groups";
        app.replaceChildren(header, toolbar, content); app.setAttribute("aria-busy", "false");
        if (!Array.isArray(result?.groups)) {
          const error = element("p", "error", "불러오기 실패"); error.setAttribute("role", "alert"); content.append(error); return;
        }
        const url = siteUrl(result.context_site_url);
        if (url) {
          const link = element("a", "icon-button"); link.href = url; link.target = "_blank"; link.rel = "noopener noreferrer";
          link.setAttribute("aria-label", "통합 Site에서 Sense 열기 (새 창)"); link.title = "통합 Site에서 Sense 열기"; link.append(icon("external")); actions.append(link);
        }
        for (const group of result.groups) {
          const groupNode = element("section", "group"); groupNode.append(element("h2", "group-title", group?.title ?? ""));
          for (const section of group?.sections ?? []) groupNode.append(sectionCard(section));
          content.append(groupNode);
        }
        const cards = [...content.querySelectorAll("details")];
        if (!cards.length) { content.append(element("p", "empty", "내용 없음")); return; }
        const toggle = element("button", "icon-button"); toggle.type = "button"; toggle.setAttribute("aria-controls", content.id);
        function updateToggle() {
          const allOpen = cards.every(card => card.open);
          const label = allOpen ? "모두 접기" : "모두 펼치기";
          toggle.setAttribute("aria-label", label); toggle.title = label; toggle.setAttribute("aria-expanded", String(allOpen));
          toggle.replaceChildren(icon(allOpen ? "collapse" : "expand"));
        }
        toggle.addEventListener("click", () => { const open = cards.some(card => !card.open); for (const card of cards) card.open = open; updateToggle(); });
        for (const card of cards) card.addEventListener("toggle", updateToggle);
        updateToggle(); actions.prepend(toggle);
      }

      function rpcRequest(method, params) {
        return new Promise((resolve, reject) => {
          const id = ++rpcId;
          pending.set(id, { resolve, reject });
          window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
        });
      }
      function rpcNotify(method, params) { window.parent.postMessage({ jsonrpc: "2.0", method, params }, "*"); }
      window.addEventListener("message", event => {
        if (event.source !== window.parent) return;
        const message = event.data;
        if (!message || message.jsonrpc !== "2.0") return;
        if (message.id !== undefined) {
          const callback = pending.get(message.id); if (!callback) return; pending.delete(message.id);
          if (message.error) callback.reject(message.error); else callback.resolve(message.result); return;
        }
        if (message.method === "ui/notifications/tool-result") render(message.params?.structuredContent);
      }, { passive: true });
      const openaiOutput = window.openai?.toolOutput;
      if (openaiOutput) render(openaiOutput);
      rpcRequest("ui/initialize", {
        appInfo: { name: "sense-guidance", version: "0.1.3" },
        appCapabilities: {}, protocolVersion: "2026-01-26",
      }).then(() => rpcNotify("ui/notifications/initialized", {})).catch(() => { if (!openaiOutput) render(null); });
      window.__senseRenderForTest = render;
    </script>
  </body>
</html>
