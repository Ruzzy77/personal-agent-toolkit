[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "hypes"
version = "0.6.0"
description = "Adaptive explanations and a scoped personal cognitive model"
authors = [
  {name = "Ruzzy77"},
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
  "mcp>=2,<3",
  "pydantic>=2.12,<3",
]

[project.scripts]
hypes-mcp = "hypes.mcp_server:main"

[dependency-groups]
dev = [
  "jsonschema[format]>=4.23,<5",
  "pytest>=8.3,<9",
  "rfc8785>=0.1.4,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hypes"]
exclude = ["/src/hypes/harness/**"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
