[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "hypes"
version = "0.9.3"
description = "A persistent, revisable relationship model of the user"
authors = [
  {name = "Ruzzy77"},
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
  "mcp>=2,<3",
  "pydantic>=2.12,<3",
]

[project.scripts]
hypes-mcp = "hypes.mcp_server:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hypes"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
