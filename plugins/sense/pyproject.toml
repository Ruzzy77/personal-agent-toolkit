[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "sense"
version = "0.3.1"
description = "Keep private guidance for important choices available across AI tools"
authors = [
  {name = "Ruzzy77"},
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
  "mcp>=2,<3",
  "pydantic>=2.11,<3",
]

[project.scripts]
sense = "sense.cli:main"
sense-mcp = "sense.mcp_server:main"

[dependency-groups]
dev = [
  "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sense = ["ui/guidance/index.html"]
