<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Sense 작업 프로필</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --page: #f8faf8;
        --surface: #ffffff;
        --surface-soft: #f1f5f2;
        --text: #1d241f;
        --muted: #627067;
        --line: #dce4de;
        --accent: #47685a;
        --accent-soft: #e3eee8;
        --accent-text: #264b3b;
        --shadow: 0 14px 36px rgba(31, 57, 45, 0.08);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --page: #151917;
          --surface: #1c221e;
          --surface-soft: #242c27;
          --text: #edf3ef;
          --muted: #aab8af;
          --line: #344039;
          --accent: #91b6a4;
          --accent-soft: #294237;
          --accent-text: #d6eee2;
          --shadow: none;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--page);
        color: var(--text);
      }

      button,
      summary {
        font: inherit;
      }

      button:focus-visible,
      summary:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }

      .shell {
        width: min(100%, 860px);
        margin: 0 auto;
        padding: 20px;
      }

      .profile {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 22px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .hero {
        padding: 26px 26px 22px;
        border-bottom: 1px solid var(--line);
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
        color: var(--accent);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.01em;
      }

      .eyebrow::before {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: currentColor;
        content: "";
      }

      h1 {
        margin: 0;
        font-size: clamp(25px, 5vw, 34px);
        font-weight: 760;
        letter-spacing: -0.035em;
        line-height: 1.18;
      }

      .description {
        max-width: 670px;
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.7;
      }

      .status {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 16px;
        align-items: center;
        margin-top: 20px;
        padding: 14px 16px;
        border-radius: 14px;
        background: var(--accent-soft);
        color: var(--accent-text);
      }

      .status strong {
        display: block;
        margin-bottom: 3px;
        font-size: 14px;
      }

      .status span {
        font-size: 13px;
        line-height: 1.5;
      }

      .date {
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 18px 26px 0;
      }

      .recent {
        color: var(--muted);
        font-size: 13px;
      }

      .toggle {
        border: 0;
        border-radius: 999px;
        padding: 8px 12px;
        background: var(--surface-soft);
        color: var(--text);
        cursor: pointer;
        font-size: 12px;
        font-weight: 650;
      }

      .groups {
        display: grid;
        gap: 24px;
        padding: 22px 26px 28px;
      }

      .group-title {
        margin: 0 0 10px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }

      .section-list {
        display: grid;
        gap: 10px;
      }

      details {
        border: 1px solid var(--line);
        border-radius: 15px;
        background: var(--surface);
      }

      details[open] {
        background: var(--surface-soft);
      }

      summary {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
        align-items: center;
        min-height: 66px;
        padding: 14px 16px;
        cursor: pointer;
        list-style: none;
      }

      summary::-webkit-details-marker {
        display: none;
      }

      .section-heading {
        min-width: 0;
      }

      .section-title {
        display: block;
        font-size: 15px;
        font-weight: 720;
        line-height: 1.4;
      }

      .section-purpose {
        display: block;
        margin-top: 3px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }

      .summary-end {
        display: flex;
        align-items: center;
        gap: 9px;
      }

      .badges {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 5px;
      }

      .badge {
        border-radius: 999px;
        padding: 4px 8px;
        background: var(--accent-soft);
        color: var(--accent-text);
        font-size: 11px;
        font-weight: 650;
        white-space: nowrap;
      }

      .chevron {
        width: 8px;
        height: 8px;
        border-right: 1.5px solid var(--muted);
        border-bottom: 1.5px solid var(--muted);
        transform: rotate(45deg);
        transition: transform 150ms ease;
      }

      details[open] .chevron {
        transform: rotate(225deg);
      }

      .section-body {
        padding: 0 16px 18px;
      }

      .section-text {
        margin: 0;
        color: var(--text);
        font-size: 14px;
        line-height: 1.78;
        white-space: pre-line;
      }

      .facts {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin-top: 18px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
      }

      .fact h3 {
        margin: 0 0 7px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
      }

      .fact ul {
        display: grid;
        gap: 5px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .fact li {
        color: var(--text);
        font-size: 12px;
        line-height: 1.5;
      }

      .restricted {
        padding: 0 16px 17px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
      }

      .privacy {
        display: grid;
        gap: 8px;
        padding: 18px 26px 22px;
        border-top: 1px solid var(--line);
        background: var(--surface-soft);
      }

      .privacy h2 {
        margin: 0 0 2px;
        font-size: 13px;
      }

      .privacy-item {
        display: flex;
        gap: 9px;
        align-items: flex-start;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }

      .privacy-item::before {
        flex: 0 0 auto;
        width: 5px;
        height: 5px;
        margin-top: 6px;
        border-radius: 50%;
        background: var(--accent);
        content: "";
      }

      .empty,
      .error {
        padding: 32px;
        color: var(--muted);
        text-align: center;
        line-height: 1.6;
      }

      @media (max-width: 640px) {
        .shell {
          padding: 10px;
        }

        .profile {
          border-radius: 17px;
        }

        .hero,
        .toolbar,
        .groups,
        .privacy {
          padding-right: 18px;
          padding-left: 18px;
        }

        .status {
          grid-template-columns: 1fr;
          gap: 7px;
        }

        .toolbar {
          align-items: flex-start;
        }

        .facts {
          grid-template-columns: 1fr;
        }

        .badges {
          display: none;
        }

      }

      @media (prefers-reduced-motion: reduce) {
        .chevron {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell" id="app" aria-live="polite">
      <div class="profile">
        <div class="empty">작업 프로필을 불러오는 중입니다.</div>
      </div>
    </main>

    <script type="module">
      const app = document.getElementById("app");
      let rpcId = 0;
      const pending = new Map();

      function element(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = String(text);
        return node;
      }

      function list(items) {
        const node = element("ul");
        for (const item of items ?? []) {
          node.append(element("li", "", item));
        }
        return node;
      }

      function sourceText(source) {
        const count = Number(source?.count ?? 0);
        return `${String(source?.label ?? "확인한 출처")} ${count}건`;
      }

      function fact(title, items) {
        const node = element("section", "fact");
        node.append(element("h3", "", title), list(items));
        return node;
      }

      function sectionCard(section) {
        const card = document.createElement("details");

        const summary = document.createElement("summary");
        const heading = element("div", "section-heading");
        heading.append(
          element("span", "section-title", section?.title ?? "이름 없는 내용"),
          element("span", "section-purpose", section?.purpose ?? "")
        );
        const end = element("div", "summary-end");
        const badges = element("div", "badges");
        for (const origin of section?.origins ?? []) {
          badges.append(element("span", "badge", origin));
        }
        end.append(badges, element("span", "chevron"));
        summary.append(heading, end);
        card.append(summary);

        const body = element("div", "section-body");
        body.append(element("p", "section-text", section?.text ?? ""));
        const facts = element("div", "facts");
        facts.append(
          fact("관련 작업", section?.related_work ?? []),
          fact("주의할 상황", section?.review_when ?? []),
          fact("출처", (section?.sources ?? []).map(sourceText))
        );
        body.append(facts);
        card.append(body);
        return card;
      }

      function formatDate(value) {
        const date = new Date(value);
        if (Number.isNaN(date.valueOf())) return "";
        return new Intl.DateTimeFormat("ko-KR", {
          year: "numeric",
          month: "long",
          day: "numeric",
        }).format(date);
      }

      function render(payload) {
        const result = payload?.ok === true ? payload.result : payload;
        if (!result?.groups) {
          const message =
            payload?.error?.message ?? "작업 프로필을 불러오지 못했습니다.";
          const box = element("div", "profile");
          box.append(element("div", "error", message));
          app.replaceChildren(box);
          return;
        }

        const profile = element("article", "profile");
        const hero = element("header", "hero");
        hero.append(
          element("div", "eyebrow", "Sense"),
          element("h1", "", result.title ?? "작업 프로필"),
          element("p", "description", result.description ?? "")
        );

        const status = element("div", "status");
        const statusCopy = element("div");
        statusCopy.append(
          element("strong", "", result.state?.label ?? ""),
          element("span", "", result.state?.description ?? "")
        );
        const formattedDate = formatDate(result.updated_at);
        status.append(
          statusCopy,
          element("div", "date", formattedDate ? `${formattedDate} 수정` : "")
        );
        hero.append(status);
        profile.append(hero);

        const toolbar = element("div", "toolbar");
        if (result.recent_change) {
          toolbar.append(element("div", "recent", result.recent_change));
        }
        const toggle = element("button", "toggle", "모두 펼치기");
        toggle.type = "button";
        toggle.addEventListener("click", () => {
          const cards = [...profile.querySelectorAll("details")];
          const shouldOpen = cards.some((card) => !card.open);
          for (const card of cards) card.open = shouldOpen;
          toggle.textContent = shouldOpen ? "모두 접기" : "모두 펼치기";
        });
        toolbar.append(toggle);
        profile.append(toolbar);

        const groups = element("div", "groups");
        for (const group of result.groups) {
          const groupNode = element("section", "group");
          groupNode.append(element("h2", "group-title", group?.title ?? ""));
          const sectionList = element("div", "section-list");
          for (const section of group?.sections ?? []) {
            sectionList.append(sectionCard(section));
          }
          groupNode.append(sectionList);
          groups.append(groupNode);
        }
        profile.append(groups);

        const privacy = element("footer", "privacy");
        privacy.append(element("h2", "", "보관 원칙"));
        for (const item of result.privacy ?? []) {
          privacy.append(element("div", "privacy-item", item));
        }
        profile.append(privacy);
        app.replaceChildren(profile);
      }

      function rpcRequest(method, params) {
        return new Promise((resolve, reject) => {
          const id = ++rpcId;
          pending.set(id, { resolve, reject });
          window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
        });
      }

      function rpcNotify(method, params) {
        window.parent.postMessage({ jsonrpc: "2.0", method, params }, "*");
      }

      window.addEventListener(
        "message",
        (event) => {
          if (event.source !== window.parent) return;
          const message = event.data;
          if (!message || message.jsonrpc !== "2.0") return;

          if (message.id !== undefined) {
            const callback = pending.get(message.id);
            if (!callback) return;
            pending.delete(message.id);
            if (message.error) callback.reject(message.error);
            else callback.resolve(message.result);
            return;
          }

          if (message.method === "ui/notifications/tool-result") {
            render(message.params?.structuredContent);
          }
        },
        { passive: true }
      );

      const openaiOutput = window.openai?.toolOutput;
      if (openaiOutput) render(openaiOutput);

      rpcRequest("ui/initialize", {
        appInfo: { name: "sense-work-profile", version: "0.1.2" },
        appCapabilities: {},
        protocolVersion: "2026-01-26",
      })
        .then(() => rpcNotify("ui/notifications/initialized", {}))
        .catch(() => {
          if (!openaiOutput) {
            const box = element("div", "profile");
            box.append(
              element(
                "div",
                "error",
                "이 화면을 지원하는 앱에서 작업 프로필을 열어 주세요."
              )
            );
            app.replaceChildren(box);
          }
        });

      window.__senseRenderForTest = render;
    </script>
  </body>
</html>
