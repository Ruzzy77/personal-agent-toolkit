[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "corpus"
version = "0.11.4"
description = "Connect saved questions and relationships to their exact current sources."
readme = "README.md"
authors = [
  {name = "Ruzzy77"},
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
  "defusedxml>=0.7.1,<1",
  "mcp>=2,<3",
  "olefile>=0.47,<1",
  "openpyxl>=3.1,<4",
  "pydantic>=2.11,<3",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "python-pptx>=1.0,<2",
]

[project.scripts]
corpus = "corpus.cli:main"
corpus-mcp = "corpus.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
corpus = ["native/*.swift"]
