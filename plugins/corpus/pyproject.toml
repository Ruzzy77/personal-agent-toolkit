[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "corpus"
version = "0.19.1"
description = "Connect saved questions and relationships to their exact current sources."
readme = "README.md"
authors = [
  {name = "Ruzzy77"},
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
  "mcp>=2,<3",
  "pydantic>=2.11,<3",
]

[project.scripts]
corpus = "corpus.cli:main"
corpus-mcp = "corpus.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
corpus = ["native/*.swift"]
