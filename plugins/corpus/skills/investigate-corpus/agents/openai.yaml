interface:
  display_name: "Read with Corpus"
  short_description: "Use saved context and only the sources still needed"
  default_prompt: "Use $investigate-corpus to start from the relevant Corpus context and read only any current source text the request still needs."
dependencies:
  tools:
    - type: "mcp"
      value: "corpus"
      description: "Find saved contexts and read exact files, provider records, and earlier conversations"
      transport: "stdio"
policy:
  allow_implicit_invocation: true
