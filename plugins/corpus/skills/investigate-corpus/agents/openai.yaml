interface:
  display_name: "Find Work Context in Corpus"
  short_description: "Connect this task to its work and sources"
  default_prompt: "Use $investigate-corpus to identify the work context behind this task and open the original sources I need."
dependencies:
  tools:
    - type: "mcp"
      value: "corpus"
      description: "Corpus tools for finding work context and reading exact files, email records, and completed tasks"
      transport: "stdio"
policy:
  allow_implicit_invocation: true
