interface:
  display_name: "Corpus Overview"
  short_description: "Show sources, saved context, and review needs"
  default_prompt: "Use $show-corpus-overview to show my Corpus sources, saved context, items that need review, and retained history."
dependencies:
  tools:
    - type: "mcp"
      value: "corpus"
      description: "Read-only Corpus overview of sources, saved context, and retained history"
      transport: "stdio"
policy:
  allow_implicit_invocation: true
