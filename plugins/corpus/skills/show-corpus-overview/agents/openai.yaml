interface:
  display_name: "Corpus Work Overview"
  short_description: "Show work contexts and their materials"
  default_prompt: "Use $show-corpus-overview to show the work contexts Corpus can help me continue and the materials connected to them."
dependencies:
  tools:
    - type: "mcp"
      value: "corpus"
      description: "Read-only Corpus overview of work contexts, connected materials, and retained history"
      transport: "stdio"
policy:
  allow_implicit_invocation: true
