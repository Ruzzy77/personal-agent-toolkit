      <stop offset="0" stop-color="#9B6CFF"/>
      <stop offset="0.48" stop-color="#7357E8"/>
      <stop offset="1" stop-color="#4438B8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(292 62) rotate(128) scale(196 172)" gradientUnits="userSpaceOnUse">
