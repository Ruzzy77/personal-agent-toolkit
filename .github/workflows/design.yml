name: Design

on:
  pull_request:
    paths:
      - ".github/workflows/design.yml"
      - "plugins/design/**"
      - "sites/design/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/design.yml"
      - "plugins/design/**"
      - "sites/design/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sites/design/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: sites/design
      - name: Check dependencies
        run: npm audit --audit-level=high
        working-directory: sites/design
      - name: Validate Design Site and plugin export
        run: npm run check
        working-directory: sites/design
      - name: Confirm generated files are committed
        run: git diff --exit-code -- plugins/design sites/design
