<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{{title}}</title>
  <!-- saegin:styles profile=reader -->
  <style>
/* ============================================================
   공용 코어 — 여섯 디자인이 똑같이 쓰는 최소 규칙만 담는다.
   bundle.py가 모든 디자인의 모든 프로필 맨 앞에 자동으로 포함하므로
   디자인별 base.css가 언제든 덮어쓸 수 있다. 선언이 디자인마다
   조금이라도 다른 규칙(제목, 표 괘선, 인용 등)은 여기 넣지 않는다.
   ============================================================ */

*,
*::before,
*::after {
  box-sizing: border-box;
}

img {
  display: block;
  max-width: 100%;
  height: auto;
}

figure {
  margin: 0;
}

td.num,
th.num {
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.sr-only {
  position: absolute !important;
  width: 1px !important;
  height: 1px !important;
  padding: 0 !important;
  margin: -1px !important;
  overflow: hidden !important;
  clip: rect(0, 0, 0, 0) !important;
  white-space: nowrap !important;
  border: 0 !important;
}

@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }

  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* 색인(Saegin) · tokens */

:root {
  color-scheme: dark;

  --cobalt: #081747;
  --cobalt-deep: #040a28;
  --paper: #081747;
  --surface: #0c1d54;
  --surface-strong: #112766;
  --ink: #f4f2e9;
  --soft: #b2bcda;
  --faint: #8d9ac2;
  --line: #354877;
  --line-strong: #f4f2e9;
  --accent: #c9ed12;
  --accent-hover: #ddfa31;
  --accent-pressed: #afd108;
  --accent-ink: #081747;
  --link: #c9ed12;

  --font-sans: ui-sans-serif, -apple-system, BlinkMacSystemFont,
    "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif;
  --font-display: "Arial Black", "Arial Narrow", var(--font-sans);
  --font-serif: ui-serif, Georgia, "AppleMyungjo", "Noto Serif KR",
    "Nanum Myeongjo", "Batang", serif;
  --font-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

  --reader-scale: 1;
  --text-display: clamp(2.65rem, 6.3vw, 4.75rem);
  --text-section: clamp(1.35rem, 2.6vw, 1.78rem);
  --text-subsection: 1.12rem;
  --text-body: 1.0625rem;
  --text-lead: clamp(1.08rem, 2vw, 1.28rem);
  --text-small: 0.82rem;
  --text-caption: 0.78rem;
  --leading-display: 1.02;
  --leading-body: 1.78;
  --leading-lead: 1.62;
  --tracking-display: -0.052em;
  --tracking-label: 0.065em;

  --page-max: 1120px;
  --measure: 46rem;
  --rail: 180px;
  --rail-gap: 52px;
  --gutter: clamp(20px, 4.2vw, 52px);
  --chrome-height: 42px;
  --control-min: 42px;
  --radius: 0;
  --shadow: none;

  /* 간격 눈금 — 라이브러리 공용 (여백에서 승격) */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;
}

:root[data-reader-size="0"] { --reader-scale: 0.9; }
:root[data-reader-size="1"] { --reader-scale: 1; }
:root[data-reader-size="2"] { --reader-scale: 1.125; }
:root[data-reader-size="3"] { --reader-scale: 1.25; }

/* 색인(Saegin) · base */

html {
  min-width: 320px;
  font-size: calc(16px * var(--reader-scale));
  background: var(--paper);
  scroll-behavior: smooth;
}

body {
  min-width: 320px;
  margin: 0;
  color: var(--ink);
  background: var(--paper);
  font-family: var(--font-sans);
  font-size: var(--text-body);
  line-height: var(--leading-body);
  letter-spacing: -0.008em;
  word-break: keep-all;
  overflow-wrap: anywhere;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
}

button,
input,
select,
textarea {
  font: inherit;
}

button,
a,
input,
select,
textarea {
  -webkit-tap-highlight-color: transparent;
}

::selection {
  color: var(--accent-ink);
  background: var(--accent);
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

a {
  color: var(--link);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.2em;
}

h1,
h2,
h3,
h4,
p,
ul,
ol,
dl,
figure,
blockquote {
  margin-top: 0;
}

h1,
h2,
h3,
h4 {
  color: var(--ink);
  font-family: var(--font-sans);
  text-wrap: balance;
}

h1 {
  max-width: 12.5ch;
  margin-bottom: 0;
  font-size: var(--text-display);
  font-weight: 790;
  letter-spacing: var(--tracking-display);
  line-height: var(--leading-display);
}

h2 {
  margin-bottom: 0.78em;
  font-size: var(--text-section);
  font-weight: 760;
  letter-spacing: -0.03em;
  line-height: 1.28;
}

h3 {
  margin-bottom: 0.65em;
  font-size: var(--text-subsection);
  font-weight: 740;
  letter-spacing: -0.018em;
  line-height: 1.4;
}

p {
  margin-bottom: 1.35em;
}

ul,
ol {
  margin-bottom: 1.35em;
  padding-left: 1.25em;
}

li + li {
  margin-top: 0.42em;
}

li::marker {
  color: var(--accent);
}

strong {
  font-weight: 760;
}

em {
  font-style: normal;
  font-weight: 680;
}

hr {
  margin: 46px 0;
  border: 0;
  border-top: 1px solid var(--line);
}

blockquote {
  margin: 2em 0;
  padding: 18px 0 18px 22px;
  border-left: 8px solid var(--accent);
  color: var(--ink);
  background: var(--surface);
}

.reader-quote {
  font-family: var(--font-serif);
  font-size: 1.16em;
  line-height: 1.72;
}

code,
kbd {
  padding: 0.08em 0.32em;
  color: var(--ink);
  background: var(--surface-strong);
  font-family: var(--font-mono);
  font-size: 0.84em;
}

pre {
  max-width: 100%;
  margin: 1.4em 0;
  padding: 16px 18px;
  border: 1px solid var(--line);
  color: var(--ink);
  background: var(--surface);
  overflow-x: auto;
  font-size: 0.82rem;
  line-height: 1.7;
}

pre code {
  padding: 0;
  background: transparent;
  font-size: inherit;
}

table {
  width: 100%;
  min-width: 580px;
  border-collapse: collapse;
  font-size: 0.88rem;
  line-height: 1.55;
}

th,
td {
  padding: 12px 14px;
  border: 1px solid var(--line);
  text-align: left;
  vertical-align: top;
}

thead th {
  border-color: var(--accent-ink);
  color: var(--accent-ink);
  background: var(--accent);
  font-size: var(--text-caption);
  font-weight: 800;
  letter-spacing: 0.02em;
}

tbody th {
  font-weight: 730;
}

.table-scroll,
.diagram-scroll,
.visual-scroll {
  max-width: 100%;
  overflow-x: auto;
  overscroll-behavior-inline: contain;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

.reader-sr-only {
  position: absolute !important;
  width: 1px !important;
  height: 1px !important;
  padding: 0 !important;
  margin: -1px !important;
  overflow: hidden !important;
  clip: rect(0, 0, 0, 0) !important;
  white-space: nowrap !important;
  border: 0 !important;
}

/* 색인(Saegin) · reader */

[data-library-return] {
  position: fixed;
  z-index: 1000;
  top: 16px;
  left: 16px;
  margin: 0;
}

[data-library-return] a {
  display: inline-flex;
  min-width: 116px;
  min-height: var(--chrome-height);
  align-items: center;
  justify-content: center;
  padding: 0 18px;
  border: 1px solid var(--cobalt-deep);
  color: var(--accent-ink);
  background: var(--accent);
  font-family: var(--font-display);
  font-size: 0.88rem;
  font-weight: 900;
  letter-spacing: 0.035em;
  line-height: 1;
  text-decoration: none;
}

[data-library-return] a:hover {
  background: var(--accent-hover);
}

[data-library-return] a:active {
  background: var(--accent-pressed);
}

[data-library-return] a:focus-visible,
.reader-tools button:focus-visible {
  outline-color: var(--accent);
  box-shadow: 0 0 0 2px var(--cobalt-deep);
}

.reader-tools {
  position: fixed;
  z-index: 1000;
  top: 16px;
  right: 16px;
  display: grid;
  grid-template-columns: repeat(2, var(--control-min));
  margin: 0;
  border: 1px solid var(--cobalt-deep);
  background: var(--accent);
}

.reader-tools button {
  min-width: var(--control-min);
  min-height: var(--chrome-height);
  padding: 0;
  border: 0;
  border-left: 1px solid var(--cobalt-deep);
  border-radius: 0;
  color: var(--accent-ink);
  background: var(--accent);
  font-size: 0.82rem;
  font-weight: 830;
  line-height: 1;
  cursor: pointer;
}

.reader-tools button:first-of-type {
  border-left: 0;
}

.reader-tools button:hover:not(:disabled) {
  background: var(--accent-hover);
}

.reader-tools button:active:not(:disabled) {
  background: var(--accent-pressed);
}

.reader-tools button:disabled {
  opacity: 0.44;
  cursor: not-allowed;
}

.reader-document {
  width: min(calc(100% - (var(--gutter) * 2)), var(--page-max));
  margin-inline: auto;
  padding: 116px 0 104px;
}

.reader-opening {
  display: grid;
  grid-template-columns: minmax(148px, var(--rail)) minmax(0, var(--measure));
  gap: var(--rail-gap);
  align-items: start;
  padding-bottom: 52px;
  border-bottom: 1px solid var(--line);
}

.reader-meta {
  display: flex;
  min-width: 0;
  flex-direction: column;
  gap: 9px;
  color: var(--soft);
  font-size: var(--text-small);
  font-weight: 680;
  letter-spacing: var(--tracking-label);
  line-height: 1.45;
}

.reader-meta::before {
  width: 46px;
  height: 12px;
  margin-bottom: 14px;
  background: var(--accent);
  content: "";
}

.reader-meta .masthead {
  display: contents;
}

.reader-meta time,
.reader-meta span,
.reader-meta p,
.reader-meta strong {
  display: block;
  margin: 0;
  color: inherit;
  font: inherit;
}

.reader-meta .reader-publication,
.reader-meta .reader-date {
  white-space: nowrap;
}

.reader-header {
  display: block;
  min-width: 0;
}

.reader-header h1 {
  margin: 0;
  padding: 0;
  border: 0;
  color: var(--ink);
  background: transparent;
  box-shadow: none;
}

.reader-header .standfirst,
.reader-header .lead {
  max-width: 42rem;
  margin: 26px 0 0;
  color: var(--soft);
  font-size: var(--text-lead);
  font-weight: 450;
  line-height: var(--leading-lead);
}

.reader-content {
  width: min(100%, var(--measure));
  margin-top: 0;
  margin-left: calc(var(--rail) + var(--rail-gap));
}

.reader-content > article,
.reader-content > section,
.reader-content > figure,
.reader-section {
  margin: 0;
  padding: 42px 0;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: transparent;
}

.reader-content > article {
  padding-top: 46px;
}

.reader-content > article > :last-child,
.reader-content > section > :last-child,
.reader-content > figure > :last-child {
  margin-bottom: 0;
}

.reader-content h2 {
  display: grid;
  grid-template-columns: 12px minmax(0, 1fr);
  gap: 14px;
  align-items: baseline;
  margin-top: 2.6em;
}

.reader-content > section > h2:first-child,
.reader-content > article > h2:first-child,
.reader-content h2:first-child {
  margin-top: 0;
}

.reader-content h2::before {
  width: 11px;
  height: 11px;
  background: var(--accent);
  content: "";
}

.reader-content h3 {
  margin-top: 2.1em;
}

.reader-content figure {
  width: 100%;
}

figcaption {
  margin-bottom: 16px;
  color: var(--soft);
  font-size: var(--text-small);
  line-height: 1.55;
}

figcaption strong {
  display: block;
  margin-bottom: 4px;
  color: var(--ink);
  font-size: 1rem;
}

.callout,
.reader-callout,
.finding,
.conclusion,
.maxim {
  margin: 2em 0;
  padding: 20px 22px;
  border: 0;
  border-left: 8px solid var(--accent);
  color: var(--ink);
  background: var(--surface);
}

.callout > :last-child,
.reader-callout > :last-child,
.finding > :last-child,
.conclusion > :last-child,
.maxim > :last-child {
  margin-bottom: 0;
}

.maxim {
  font-family: var(--font-serif);
  font-size: 1.12em;
}

.reader-key-sentence {
  color: var(--accent);
  background: transparent;
  font-weight: 720;
}

.reader-document .num {
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.source,
.references,
.footnote {
  color: var(--soft);
  font-size: var(--text-small);
  line-height: 1.65;
}

.source-label {
  display: block;
  margin-top: 5px;
}

@media (max-width: 820px) {
  .reader-document {
    padding-top: 102px;
  }

  .reader-opening {
    grid-template-columns: minmax(0, 1fr);
    gap: 34px;
    padding-bottom: 40px;
  }

  .reader-meta {
    display: grid;
    grid-template-columns: 46px minmax(0, 1fr);
    gap: 8px 14px;
    align-items: start;
  }

  .reader-meta::before {
    grid-row: 1 / span 3;
    margin: 3px 0 0;
  }

  .reader-meta .masthead {
    display: contents;
    grid-column: 2;
  }

  .reader-meta > :not(.masthead) {
    grid-column: 2;
  }

  .reader-content {
    margin-left: 0;
  }
}

@media (max-width: 520px) {
  [data-library-return],
  .reader-tools {
    top: 10px;
  }

  [data-library-return] {
    left: 10px;
  }

  [data-library-return] a {
    min-width: 104px;
    padding-inline: 13px;
    font-size: 0.79rem;
  }

  .reader-tools {
    right: 10px;
    grid-template-columns: repeat(2, 40px);
  }

  .reader-tools button {
    min-width: 40px;
  }

  .reader-document {
    padding-top: 88px;
    padding-bottom: 72px;
  }

  .reader-opening {
    gap: 28px;
  }

  .reader-content > article,
  .reader-content > section,
  .reader-content > figure,
  .reader-section {
    padding: 34px 0;
  }
}

@page {
  size: auto;
  margin: 18mm 18mm 21mm;
}

@media print {
  :root,
  :root[data-theme] {
    color-scheme: light;
    --paper: #fff;
    --surface: #f4f4ef;
    --surface-strong: #e8e8e2;
    --ink: #111;
    --soft: #444;
    --faint: #555;
    --line: #aaa;
    --line-strong: #111;
    /* 흰 지면에서 네온(1.35:1)은 사라진다 — 인쇄 전용 짙은 값(6.44:1) */
    --accent: #56650a;
    --accent-ink: #fff;
    --link: #111;
  }

  [data-library-return],
  .reader-tools {
    display: none !important;
  }

  .reader-document {
    width: 100%;
    padding: 0;
  }

  .reader-opening {
    display: block;
    padding-bottom: 12mm;
  }

  .reader-meta {
    margin-bottom: 8mm;
  }

  .reader-content {
    width: 100%;
    margin-left: 0;
  }

  .reader-content > article,
  .reader-content > section,
  .reader-content > figure,
  .reader-section {
    padding: 8mm 0;
    break-inside: auto;
  }

  body {
    color: #111;
    background: #fff;
    font-size: 11pt;
    line-height: 1.68;
    widows: 3;
    orphans: 3;
    print-color-adjust: exact;
    -webkit-print-color-adjust: exact;
  }
}
  </style>
  <!-- /saegin:styles -->
</head>
<body>
  <nav aria-label="Library 홈" data-library-return>
    <a href="{{library_url}}">LIBRARY</a>
  </nav>

  <aside class="reader-tools" aria-label="읽기 설정">
    <button type="button" aria-label="글자 작게">A−</button>
    <button type="button" aria-label="글자 크게">A+</button>
  </aside>

  <main class="reader-document">
    <div class="reader-opening">
      <aside class="reader-meta" aria-label="발간 정보">
        <span class="reader-publication">{{publication_line}}</span>
        <time class="reader-date" datetime="{{date_iso}}">{{date_label}}</time>
      </aside>
      <header class="reader-header">
        <h1>{{title}}</h1>
        <p class="lead">{{lead}}</p>
      </header>
    </div>

    <div class="reader-content">
      <article>
        <h2>{{section_title}}</h2>
        <p>{{body}}</p>
        <div class="reader-callout">
          <strong>{{callout_title}}</strong>
          <p>{{callout_body}}</p>
        </div>
      </article>
    </div>
  </main>
</body>
</html>
