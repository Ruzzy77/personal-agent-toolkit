<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>한지 — 디자인 미리보기</title>

  <style>
/* ============================================================
   공용 코어 — 여섯 디자인이 똑같이 쓰는 최소 규칙만 담는다.
   bundle.py가 모든 디자인의 모든 프로필 맨 앞에 자동으로 포함하므로
   디자인별 base.css가 언제든 덮어쓸 수 있다. 선언이 디자인마다
   조금이라도 다른 규칙(제목, 표 괘선, 인용 등)은 여기 넣지 않는다.
   ============================================================ */

*,
*::before,
*::after {
  box-sizing: border-box;
}

img {
  display: block;
  max-width: 100%;
  height: auto;
}

figure {
  margin: 0;
}

td.num,
th.num {
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.sr-only {
  position: absolute !important;
  width: 1px !important;
  height: 1px !important;
  padding: 0 !important;
  margin: -1px !important;
  overflow: hidden !important;
  clip: rect(0, 0, 0, 0) !important;
  white-space: nowrap !important;
  border: 0 !important;
}

@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }

  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

:root {
  color-scheme: light;

  --paper: #f3efe5;
  --paper-raised: #faf7f0;
  --paper-deep: #e9e3d7;
  --paper-grain: none;

  --ink: #1c1c18;
  --ink-lead: #403e37;
  --soft: #625e55;
  --faint: #6e695f;

  --rule: #c5bdaf;
  --rule-strong: var(--ink);
  --accent: #a23e28;
  --link: #275d6b;
  --node: var(--paper-raised);
  --edge: #68635a;

  --ok: #347244;
  --warn: #85600f;
  --bad: #a23e28;

  --chart-1: #a8502f;
  --chart-2: #176c9e;
  --chart-3: #a07b1a;
  --chart-4: #94436f;
  --chart-5: #4e8039;
  --chart-6: #5b66a8;
  --chart-grid: #ddd5c7;
  --chart-axis: #a79e8e;

  --seq-100: #dae7ed;
  --seq-200: #b9d1de;
  --seq-300: #97bace;
  --seq-400: #74a3bd;
  --seq-500: #518cab;
  --seq-600: #2f7599;
  --seq-700: #1a5d7f;
  --div-neg: #176c9e;
  --div-mid: #e5ded1;
  --div-pos: #a8502f;

  --font-sans: ui-sans-serif, -apple-system, BlinkMacSystemFont,
    "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif;
  --font-serif: ui-serif, Georgia, "AppleMyungjo", "Noto Serif KR", "Batang", serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --text-display: clamp(2.35rem, 7vw, 4.6rem);
  --text-title: clamp(1.35rem, 3vw, 1.8rem);
  --text-lead: clamp(1.05rem, 2.2vw, 1.25rem);
  --text-body: 1rem;
  --text-caption: 0.86rem;
  --text-small: 0.8rem;
  --text-micro: 0.74rem;

  --leading-display: 1.02;
  --leading-title: 1.3;
  --leading-body: 1.68;
  --leading-caption: 1.5;
  --tracking-display: -0.055em;
  --tracking-title: -0.025em;
  --tracking-label: 0.035em;
  --tracking-wide: 0.06em;
  --weight-display: 780;
  --weight-title: 720;
  --weight-strong: 700;

  --page-max: 980px;
  --page-gutter: 40px;
  --measure: 680px;
  --measure-wide: 820px;
  --block-pad: 34px;
  --radius-node: 0;
  --radius-pill: 0;
  --shadow-pop: none;

  /* 간격 눈금 — 라이브러리 공용 (여백에서 승격) */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #191814;
  --paper-raised: #211f1a;
  --paper-deep: #11110e;
  --ink: #eee9df;
  --ink-lead: #d4cec2;
  --soft: #aaa397;
  --faint: #9b958b;
  --rule: #48443b;
  --accent: #e1785f;
  --link: #82b5c0;
  --edge: #aaa397;
  --ok: #70ad7b;
  --warn: #d1aa58;
  --bad: #e1785f;
  --chart-1: #c4714d;
  --chart-2: #3d97cd;
  --chart-3: #b58a35;
  --chart-4: #b56b92;
  --chart-5: #6fa25c;
  --chart-6: #7f88cf;
  --chart-grid: #34312b;
  --chart-axis: #5e584d;
  --seq-100: #2c3e4a;
  --seq-200: #355061;
  --seq-300: #3f6377;
  --seq-400: #47758e;
  --seq-500: #578ca6;
  --seq-600: #6ba3bd;
  --seq-700: #86bcd4;
  --div-neg: #3d97cd;
  --div-mid: #38342d;
  --div-pos: #c4714d;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #191814;
    --paper-raised: #211f1a;
    --paper-deep: #11110e;
    --ink: #eee9df;
    --ink-lead: #d4cec2;
    --soft: #aaa397;
    --faint: #9b958b;
    --rule: #48443b;
    --accent: #e1785f;
    --link: #82b5c0;
    --edge: #aaa397;
    --ok: #70ad7b;
    --warn: #d1aa58;
    --bad: #e1785f;
    --chart-1: #c4714d;
    --chart-2: #3d97cd;
    --chart-3: #b58a35;
    --chart-4: #b56b92;
    --chart-5: #6fa25c;
    --chart-6: #7f88cf;
    --chart-grid: #34312b;
    --chart-axis: #5e584d;
    --seq-100: #2c3e4a;
    --seq-200: #355061;
    --seq-300: #3f6377;
    --seq-400: #47758e;
    --seq-500: #578ca6;
    --seq-600: #6ba3bd;
    --seq-700: #86bcd4;
    --div-neg: #3d97cd;
    --div-mid: #38342d;
    --div-pos: #c4714d;
  }
}

html {
  background: var(--paper);
}

body {
  margin: 0;
  color: var(--ink);
  background: var(--paper);
  font-family: var(--font-sans);
  font-size: var(--text-body);
  line-height: var(--leading-body);
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
  word-break: keep-all;
  overflow-wrap: anywhere;
}

::selection {
  background: color-mix(in srgb, var(--accent) 20%, var(--paper));
}

a {
  color: var(--link);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.18em;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

h1 {
  margin: 0;
  max-width: var(--measure-wide);
  font-size: var(--text-display);
  font-weight: var(--weight-display);
  letter-spacing: var(--tracking-display);
  line-height: var(--leading-display);
  text-wrap: balance;
}

h2 {
  margin: 0 0 16px;
  font-size: var(--text-title);
  font-weight: var(--weight-title);
  letter-spacing: var(--tracking-title);
  line-height: var(--leading-title);
  text-wrap: balance;
}

h3 {
  margin: 0 0 10px;
  font-size: 1.05rem;
  font-weight: var(--weight-title);
  line-height: 1.4;
}

p {
  margin: 0.75em 0;
}

ul,
ol {
  margin: 0.7em 0;
  padding-left: 21px;
}

li {
  margin: 4px 0;
}

li::marker {
  color: var(--soft);
}

strong,
em {
  font-style: normal;
  font-weight: 700;
}

hr {
  margin: 32px 0;
  border: 0;
  border-top: 1px solid var(--rule);
}

blockquote {
  max-width: var(--measure);
  margin: 1.2em 0;
  padding-left: 16px;
  border-left: 2px solid var(--rule-strong);
  color: var(--ink-lead);
  font-size: 1.05rem;
  line-height: 1.65;
}

code,
kbd {
  padding: 0.08em 0.35em;
  background: var(--paper-deep);
  font-family: var(--font-mono);
  font-size: 0.86em;
}

pre {
  margin: 1.1em 0;
  padding: 14px 16px;
  background: var(--paper-deep);
  border: 1px solid var(--rule);
  overflow-x: auto;
  font-size: 0.84rem;
  line-height: 1.6;
}

pre code {
  padding: 0;
  background: none;
  font-size: inherit;
}

table {
  width: 100%;
  min-width: 560px;
  border-collapse: collapse;
  font-size: var(--text-caption);
  line-height: 1.5;
}

th,
td {
  padding: 10px 14px 10px 0;
  border-bottom: 1px solid var(--rule);
  text-align: left;
  vertical-align: top;
}

thead th {
  border-top: 2px solid var(--rule-strong);
  border-bottom-color: var(--rule-strong);
  font-size: var(--text-micro);
}

tbody th {
  font-weight: var(--weight-strong);
}

.table-scroll,
.diagram-scroll,
.visual-scroll {
  max-width: 100%;
  overflow-x: auto;
  overscroll-behavior-inline: contain;
}

.diagram-scroll img,
.table-scroll table {
  max-width: none;
}

@page {
  size: auto;
  margin: 18mm 16mm 20mm;
}

@media print {
  :root,
  :root[data-theme] {
    color-scheme: light;
    --paper: #fff;
    --paper-raised: #fff;
    --paper-deep: #f3f3f0;
    --ink: #181815;
    --ink-lead: #393832;
    --soft: #55534d;
    --faint: #64615a;
    --rule: #bbb7ad;
    --accent: #8e3523;
    --link: #275d6b;
    --edge: #625d54;
    --shadow-pop: none;
  }

  body {
    background: #fff;
    widows: 3;
    orphans: 3;
    print-color-adjust: exact;
    -webkit-print-color-adjust: exact;
  }

  main {
    width: 100%;
    padding: 0;
  }

  .table-scroll,
  .diagram-scroll,
  .visual-scroll {
    overflow: visible;
  }

  a {
    color: inherit;
  }

  h1,
  h2,
  h3,
  figcaption {
    break-after: avoid-page;
  }

  p,
  li,
  blockquote {
    widows: 3;
    orphans: 3;
  }

  thead {
    display: table-header-group;
  }

  tr,
  figure,
  blockquote {
    break-inside: avoid;
  }
}

main {
  width: min(calc(100% - var(--page-gutter)), var(--page-max));
  margin: 0 auto;
  padding: 48px 0 80px;
}

.brief-header {
  padding: 0 0 28px;
  border-bottom: 2px solid var(--rule-strong);
}

.brief-header time {
  display: block;
  margin-bottom: 14px;
  color: var(--soft);
  font-size: var(--text-micro);
  font-variant-numeric: tabular-nums;
}

.lead {
  max-width: var(--measure);
  margin: 16px 0 0;
  color: var(--ink-lead);
  font-size: var(--text-lead);
  line-height: 1.6;
}

.eyebrow {
  margin: 0 0 10px;
  color: var(--soft);
  font-size: var(--text-micro);
  font-weight: 700;
}

.block {
  margin: 0;
  padding: var(--block-pad) 0;
  border-bottom: 1px solid var(--rule);
}

.prose-block p {
  max-width: var(--measure);
}

.visual > figcaption {
  max-width: var(--measure-wide);
  margin: 0 0 16px;
}

.visual > figcaption strong {
  display: block;
  font-size: 1.05rem;
  line-height: 1.4;
}

.visual-description {
  display: block;
  margin-top: 4px;
  color: var(--soft);
  font-size: var(--text-caption);
  line-height: var(--leading-caption);
}

.image-block img {
  width: 100%;
  max-height: 760px;
  object-fit: contain;
  object-position: left center;
}

.image-block > figcaption {
  margin: 10px 0 0;
  color: var(--soft);
  font-size: var(--text-small);
}

.image-title,
.image-note,
.image-provenance {
  display: block;
  max-width: var(--measure);
}

.image-title {
  color: var(--ink);
  font-size: 0.9rem !important;
}

.image-provenance {
  margin-top: 3px;
  font-size: var(--text-micro);
}

.sources {
  margin: 12px 0 0;
  color: var(--soft);
  font-size: var(--text-micro);
  overflow-wrap: anywhere;
}

.sources > span {
  margin-right: 0.35em;
  color: var(--ink);
  font-weight: 700;
}

.source-index {
  font-variant-numeric: tabular-nums;
}

.callout {
  max-width: var(--measure);
  margin: 1.2em 0;
  padding-left: 16px;
  border-left: 2px solid var(--accent);
  font-size: 1.05rem;
  line-height: 1.65;
}

.callout--quiet {
  border-left-color: var(--rule);
  color: var(--ink-lead);
  font-size: 1rem;
}

.status-good {
  color: var(--ok);
  font-weight: 700;
}

.status-mid,
.status-warn {
  color: var(--warn);
  font-weight: 700;
}

.status-open {
  color: var(--accent);
  font-weight: 700;
}

.status-bad {
  color: var(--bad);
  font-weight: 700;
}

.chip {
  display: inline-block;
  padding: 2px 7px;
  border: 1px solid var(--rule);
  color: var(--soft);
  font-size: var(--text-micro);
  white-space: nowrap;
}

.chip--accent {
  color: var(--accent);
  border-color: var(--accent);
}

.stat-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 22px 28px;
}

.stat {
  padding-top: 10px;
  border-top: 1px solid var(--rule-strong);
}

.stat-label {
  color: var(--soft);
  font-size: var(--text-micro);
  font-weight: 700;
}

.stat-value {
  margin-top: 5px;
  font-size: clamp(1.65rem, 3.4vw, 2.35rem);
  font-weight: 760;
  letter-spacing: -0.035em;
  line-height: 1.08;
}

.stat-note {
  margin-top: 4px;
  color: var(--soft);
  font-size: var(--text-small);
  line-height: 1.45;
}

.stat-delta {
  font-variant-numeric: tabular-nums;
  font-weight: 700;
}

.stat-delta.up {
  color: var(--ok);
}

.stat-delta.down {
  color: var(--bad);
}

.colophon {
  margin: 28px 0 0;
  color: var(--soft);
  font-size: var(--text-micro);
  line-height: 1.6;
}

.seal {
  display: none;
}

@media (max-width: 640px) {
  main {
    width: min(calc(100% - 28px), var(--page-max));
    padding-top: 28px;
  }

  .brief-header {
    padding-bottom: 24px;
  }

  .block {
    padding: 28px 0;
  }

  table {
    min-width: 520px;
  }
}

@media print {
  main {
    width: 100%;
    padding: 0;
  }
}

/* ============================================================
   한지(Hanji) · Layer 4 — diagram assets
   관계 그림은 PNG, WebP나 AVIF 이미지 애셋으로 넣는다.
   이미지의 대체 텍스트와 가까운 설명에서 관계와 상태를 함께 밝힌다.
   ============================================================ */

.diagram-image {
  display: block;
  max-width: none;
  height: auto;
  background: transparent;
}

.diagram-scroll:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

.diagram-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 22px;
  margin: 14px 0 0;
  color: var(--soft);
  font-size: var(--text-small);
}

.diagram-legend img {
  flex: 0 0 auto;
}

/* ============================================================
   한지(Hanji) · Layer 5 — chart assets
   차트는 PNG, WebP나 AVIF 이미지 애셋으로 넣는다.
   값과 항목 이름은 이미지 안에 직접 표시하고 대체 텍스트에도 적는다.
   ============================================================ */

.chart-scroll {
  max-width: 100%;
  overflow-x: auto;
  overscroll-behavior-inline: contain;
}

.chart-scroll:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

.chart-asset {
  display: block;
  width: 100%;
  max-width: 100%;
  min-width: 420px;
  height: auto;
}

.chart-asset--dark {
  display: none;
}

:root[data-theme="dark"] .chart-asset--light {
  display: none;
}

:root[data-theme="dark"] .chart-asset--dark {
  display: block;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .chart-asset--light {
    display: none;
  }

  :root:not([data-theme="light"]) .chart-asset--dark {
    display: block;
  }
}

.chart-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 20px;
  margin: 12px 0 0;
  padding: 0;
  list-style: none;
  color: var(--ink-lead);
  font-size: var(--text-small);
}

.chart-legend .swatch {
  display: inline-block;
  width: 11px;
  height: 11px;
  margin-right: 7px;
  vertical-align: -1px;
}

.chart-note {
  margin: 10px 0 0;
  color: var(--soft);
  font-size: var(--text-micro);
  line-height: 1.5;
}
  </style>

  <style>
    .sg-bar {
      width: min(calc(100% - var(--page-gutter)), var(--page-max));
      min-height: 58px;

      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--rule);
      font-family: var(--font-sans);
      font-size: var(--text-small);

    .sg-bar a { color: var(--ink); font-weight: 700; }
    .sg-bar button {
      min-height: 36px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--soft);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .sg-chart { min-width: 520px; }
    @media (max-width: 640px) {
      .sg-bar { width: min(calc(100% - 28px), var(--page-max)); }

<body>
  <nav class="sg-bar" aria-label="디자인 미리보기">
    <a href="/" target="_top">디자인 목록</a>
    <button type="button" id="theme-toggle" aria-pressed="false">어둡게</button>
  </nav>

  <main>
    <header class="brief-header">
      <h1>자료를 빠르게 읽는 보고서</h1>
    </header>

    <section class="block" aria-labelledby="summary-title">
      <h2 id="summary-title">요약</h2>
      <div class="stat-row">
        <div class="stat">
          <div class="stat-label">전체</div>
          <div class="stat-value">48</div>
        </div>
        <div class="stat">
          <div class="stat-label">변경</div>
          <div class="stat-value">12</div>
        </div>
        <div class="stat">
          <div class="stat-label">유지</div>
          <div class="stat-value">36</div>
        </div>
      </div>
    </section>

    <section class="block prose-block" aria-labelledby="body-title">
      <h2 id="body-title">본문</h2>
      <p>중요한 내용을 먼저 적고, 필요한 자료를 바로 뒤에 둔다. 설명은 자료가 무엇을 뜻하는지 이해하는 데 필요한 만큼만 쓴다.</p>
      <p class="callout">요약과 세부 내용을 분리하면 처음 읽는 사람도 필요한 부분부터 볼 수 있다.</p>
      <p class="callout callout--quiet">보조 설명은 본문보다 작은 글자와 약한 선으로 표시한다.</p>
    </section>

    <figure class="visual block" aria-labelledby="chart-title">
      <figcaption id="chart-title">
        <strong>항목별 변화</strong>
        <span class="visual-description">막대와 값 이름을 함께 표시한다.</span>
      </figcaption>
      <div class="chart-scroll" tabindex="0" role="region" aria-label="항목별 변화 그래프">
        <img class="chart-asset chart-asset--light sg-chart"
          src="assets/chart-bars-light.png" width="620" height="220"
          alt="세 항목의 값이 18, 34, 46으로 증가하는 막대그래프">
        <img class="chart-asset chart-asset--dark sg-chart"

  <script>
    const root = document.documentElement;
    const toggle = document.getElementById("theme-toggle");
    toggle.addEventListener("click", () => {
      const dark = root.dataset.theme !== "dark";
      root.dataset.theme = dark ? "dark" : "light";
      toggle.setAttribute("aria-pressed", String(dark));
      toggle.textContent = dark ? "밝게" : "어둡게";
    });
  </script>
