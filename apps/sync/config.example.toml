service_url = "https://personal-agent-context.example.workers.dev"
device_id = "owner-mac"
display_name = "Owner Mac"
data_root = "~/Library/Application Support/Personal Agent Sync"
corpus_data_root = "~/Library/Application Support/Corpus"
corpus_python = "~/Library/Application Support/Personal Agent Sync/runtimes/corpus/bin/python"
reconcile_seconds = 15
full_reconcile_seconds = 900
event_debounce_seconds = 2

[[connections]]
space_id = "research-note"
connection_id = "main"
root = "~/Documents/research-note"
roles = ["source", "work"]
access_scope = "remote_allowed"
permission = "read_write"
corpus_id = "research-note"
generation = 1

[[connections]]
space_id = "private-archive"
connection_id = "source"
root = "~/Documents/private-archive"
roles = ["source"]
access_scope = "local_only"
permission = "read_only"
corpus_id = "private-archive"
