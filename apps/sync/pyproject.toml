[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "personal-agent-sync"
version = "0.2.1"
description = "Outbound macOS bridge between Finder files and Personal Agent remote context"
requires-python = ">=3.12"
dependencies = [
  "document-files==1.5.0",
  "httpx[http2]>=0.28,<0.29",
  "watchdog>=6,<7",
  "websockets>=15,<16",
]

[tool.uv.sources]
document-files = { path = "../../plugins/document-files" }

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[project.scripts]
personal-agent-sync = "personal_agent_sync.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_agent_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
