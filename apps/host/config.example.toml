service_url = "https://personal-agent-context.example.workers.dev"
device_id = "spark-a"
display_name = "Spark A"
data_root = "~/.local/share/personal-agent-host/state"
corpus_data_root = "~/.local/share/personal-agent-host/state/corpus"
corpus_python = "~/.local/share/personal-agent-host/runtimes/corpus/bin/python"

[host]
listen = "127.0.0.1:18790"
allowed_hosts = ["spark-host"]
max_concurrent_jobs = 4
# Commands run directly as the configured Spark owner. File-tool permissions do
# not create an OS sandbox for direct commands.

# A Host-only root needs no Corpus Space, Connection or generation.
[[host.roots]]
id = "workspace"
path = "~/Agent-Workspace"
permission = "read_write"
execute = "host"

# Flow runs as a separate app; this only allows the authenticated Host to
# forward work operations to an explicitly registered local Flow service.
[[host.flows]]
id = "workspace"
root_id = "workspace"
service_url = "http://127.0.0.1:4176"

[[connections]]
space_id = "research-note"
connection_id = "main"
root = "~/Agent-Workspace/research-note"
roles = ["source", "work"]
access_scope = "remote_allowed"
permission = "read_write"
corpus_id = "research-note"
execute = "host"
sources = []
