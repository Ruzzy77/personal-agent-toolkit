service_url = "https://personal-agent-context.example.workers.dev"
device_id = "spark-a"
display_name = "Spark A"
data_root = "~/.local/share/personal-agent-host/state"
corpus_data_root = "~/.local/share/personal-agent-host/state/corpus"
corpus_python = "~/.local/share/personal-agent-host/runtimes/corpus/bin/python"

[host]
listen = "127.0.0.1:18790"
allowed_hosts = ["spark-host"]
sandbox_image = "personal-agent-host-sandbox:1"
max_concurrent_jobs = 4
https_host_allowlist = ["registry.npmjs.org", "pypi.org", "files.pythonhosted.org"]
egress_proxy_image = "personal-agent-host-sandbox:1"
# Protected sources stay read-only through every root that reaches them.
read_only_paths = [
  "~/Agent-Workspace/work/research-regulations/sources/tukorea/current",
  "/mnt/nas/works",
]

[host.execution_profiles]
base = "personal-agent-host-sandbox:1"
web = "personal-agent-host-web:1"
documents = "personal-agent-host-documents:1"

# A Host-only root needs no Corpus Space, Connection or generation.
[[host.roots]]
id = "workspace"
path = "~/Agent-Workspace"
permission = "read_write"
execute = "sandbox"

[[connections]]
space_id = "research-note"
connection_id = "main"
root = "~/Agent-Workspace/research-note"
roles = ["source", "work"]
access_scope = "remote_allowed"
permission = "read_write"
corpus_id = "research-note"
execute = "sandbox"
sources = []
