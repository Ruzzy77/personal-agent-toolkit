[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "personal-agent-host"
version = "0.5.0"
description = "Self-hosted storage/compute for agents: workspace files and direct execution as MCP tools"
requires-python = ">=3.12"
dependencies = [
  "personal-agent-sync",
  "mcp>=2,<3",
  "uvicorn>=0.30,<1",
]

[tool.uv.sources]
personal-agent-sync = { path = "../sync" }

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "httpx>=0.28,<0.29"]

[project.scripts]
personal-agent-host = "personal_agent_host.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_agent_host"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
